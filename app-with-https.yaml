---
# 1. Deployment de una app sencilla
apiVersion: apps/v1
kind: Deployment
metadata:
  name: https-test-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: https-test
  template:
    metadata:
      labels:
        app: https-test
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
# 2. Service para la app
apiVersion: v1
kind: Service
metadata:
  name: https-test-service
  namespace: default
spec:
  selector:
    app: https-test
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
---
# 3. Ingress CON TLS (HTTPS)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: https-test-ingress
  namespace: default
  annotations:
    # Para Traefik (Ingress Controller por defecto en k3s)
    kubernetes.io/ingress.class: "traefik"
    # Redirigir HTTP a HTTPS
    traefik.ingress.kubernetes.io/redirect-entry-point: "https"
    traefik.ingress.kubernetes.io/redirect-permanent: "true"
spec:
  tls:
  - hosts:
    - mi-app.local
    secretName: mi-app-tls   # <--- EL SECRET QUE CREAMOS
  rules:
  - host: mi-app.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: https-test-service
            port:
              number: 80
